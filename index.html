<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poker Tracker</title>
  <style>
    :root { color-scheme: light dark; --bg: #0f3d2e; --card: #14523d; --fg: #f4f4f0; --muted: #b8cfc4; --accent: #f2c14e; --bad: #ff6b6b; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    main { max-width: 560px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.5rem; margin: 8px 0 16px; }
    .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; color: var(--muted); }
    input, button { font: inherit; width: 100%; padding: 12px; border-radius: 8px; border: 0; margin-bottom: 10px; }
    button { background: var(--accent); color: #222; font-weight: 600; cursor: pointer; }
    .link { word-break: break-all; background: #0b2c21; padding: 10px; border-radius: 8px; }
    .error { color: var(--bad); min-height: 1.4em; }
    [hidden] { display: none !important; }
    h2 { font-size: 1.15rem; margin: 0 0 12px; }
    .row { display: flex; gap: 8px; }
    .row input { flex: 1; }
    .row button { width: auto; }
    table { width: 100%; border-collapse: collapse; margin: 8px 0 12px; }
    th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid #0b2c21; }
    td button { margin: 0; padding: 10px 12px; width: auto; white-space: nowrap; }
    tfoot th { border: 0; color: var(--accent); }
    td input { margin: 0; padding: 8px; }
    .warn { background: var(--bad); color: #fff; padding: 10px; border-radius: 8px; margin: 8px 0; }
    .ok { color: var(--accent); }
    .pos { color: #7ee2a8; } .neg { color: var(--bad); }
    ul.transfers { padding-left: 20px; }
    button.secondary { background: transparent; color: var(--fg); border: 1px solid var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>♠ Poker Tracker</h1>

    <section id="create" class="card" hidden>
      <form id="create-form">
        <label for="new-pin">PIN del grupo (mínimo 4 caracteres)</label>
        <input id="new-pin" inputmode="numeric" minlength="4" required autocomplete="off">
        <button>Crear grupo</button>
      </form>
    </section>

    <section id="login" class="card" hidden>
      <form id="login-form">
        <label for="pin">PIN del grupo</label>
        <input id="pin" inputmode="numeric" required autocomplete="off">
        <button>Entrar</button>
      </form>
    </section>

    <section id="group" class="card" hidden>
      <label>Link para compartir con tus amigos:</label>
      <p class="link" id="share"></p>
      <button id="copy" type="button">Copiar link</button>
    </section>

    <section id="no-night" class="card" hidden>
      <button id="new-night" type="button">Nueva noche</button>
    </section>

    <section id="night" class="card" hidden>
      <h2 id="night-title"></h2>
      <label for="amount">Monto por buy-in / rebuy ($)</label>
      <input id="amount" type="number" inputmode="decimal" min="0.01" step="0.01" value="100">
      <form id="add-player" class="row">
        <input id="player-name" list="known-players" placeholder="Nombre del jugador" required maxlength="30" autocomplete="off">
        <button>Agregar</button>
      </form>
      <datalist id="known-players"></datalist>
      <table>
        <thead><tr><th>Jugador</th><th>Rebuys</th><th>Invertido</th><th></th></tr></thead>
        <tbody id="players"></tbody>
        <tfoot><tr><th>Pot</th><th></th><th id="pot"></th><th></th></tr></tfoot>
      </table>
      <button id="undo" type="button" class="secondary" hidden></button>

      <h2>Cierre</h2>
      <table>
        <thead><tr><th>Jugador</th><th>Al final ($)</th><th>Ganancia</th></tr></thead>
        <tbody id="cashouts"></tbody>
      </table>
      <div id="result"></div>
      <button id="close-night" type="button">Cerrar noche</button>
    </section>

    <section id="last-night" class="card" hidden>
      <h2 id="last-title"></h2>
      <table>
        <thead><tr><th>Jugador</th><th>Ganancia</th></tr></thead>
        <tbody id="last-net"></tbody>
      </table>
      <div id="last-result"></div>
      <button id="reopen" type="button" class="secondary">Reabrir noche</button>
    </section>

    <p class="error" id="error" role="alert"></p>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
